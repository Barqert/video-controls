<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Video Controls</title>
  <!-- An original mpv-inspired mark: a purple disc, playback ring, and play button. -->
  <circle cx="64" cy="64" r="60" fill="#46265c"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#684280" stroke-width="8"/>
  <!-- The open, brighter ring also suggests adjustment of playback properties. -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#cfaae8" stroke-width="8"
    stroke-linecap="round" stroke-dasharray="210 67" transform="rotate(-36 64 64)"/>
  <path d="M52 42 84 64 52 86Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
</svg>
